<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Speed Time">
<meta name="theme-color" content="#050505">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Speed%20Time%22%2C%22short_name%22%3A%22Speed%20Time%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23050505%22%2C%22theme_color%22%3A%22%23050505%22%7D">
<title>Speed Time</title>
<style>
  :root { color-scheme: dark; --bg:#050505; --panel:#0d0d0d; --line:#222; --fg:#f1efe9; --dim:#7d7a72; --amber:#ff5a1f; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 75% at 50% 38%, #141414 0%, var(--bg) 62%);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 12px) max(16px, env(safe-area-inset-left)) calc(env(safe-area-inset-bottom) + 14px) max(16px, env(safe-area-inset-right));
    -webkit-user-select: none; user-select: none; overflow: hidden;
  }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  #status { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-variant-numeric: tabular-nums; }
  #status.live { color: var(--amber); }
  #start {
    background: var(--amber); color: #120801; border: 0; border-radius: 999px;
    padding: 10px 22px; font-size: 15px; font-weight: 700; letter-spacing: .02em; cursor: pointer;
  }
  #start:disabled { background: var(--line); color: var(--dim); }
  #dial { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #gauge { width: min(92vw, 60vh, 470px); height: auto; display: block; cursor: default; }
  #trip { cursor: pointer; }
  #readout { text-align: center; }
  #value { font-size: clamp(64px, 22vw, 116px); font-weight: 700; line-height: .95; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
  #unit { font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--amber); margin-top: 6px; }
  #units { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 16px; }
  .chip {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 9px 4px; text-align: center; color: var(--dim); font: inherit; cursor: pointer;
  }
  .chip b { display: block; font-size: 16px; color: var(--fg); font-variant-numeric: tabular-nums; }
  .chip span { font-size: 10px; letter-spacing: .04em; }
  .chip.on { border-color: var(--amber); color: var(--amber); }
  #error { min-height: 18px; margin-top: 10px; font-size: 13px; color: #ff6a55; text-align: center; }
</style>
</head>
<body>

<header>
  <span id="status">Ready</span>
  <button id="start">Start</button>
</header>

<div id="dial">
  <svg id="gauge" viewBox="0 0 300 300" role="img" aria-label="Vintage speedometer">
    <defs>
      <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#6b6e74"/>
        <stop offset=".35" stop-color="#1a1c1f"/>
        <stop offset=".7" stop-color="#2c2f33"/>
        <stop offset="1" stop-color="#0d0e10"/>
      </linearGradient>
      <linearGradient id="rim2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2d2d30"/>
        <stop offset="1" stop-color="#050505"/>
      </linearGradient>
      <radialGradient id="face" cx="50%" cy="42%" r="68%">
        <stop offset="0" stop-color="#17181a"/>
        <stop offset="1" stop-color="#050506"/>
      </radialGradient>
      <radialGradient id="faceShade" cx="50%" cy="50%" r="50%">
        <stop offset=".86" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".55"/>
      </radialGradient>
      <linearGradient id="drumShade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#000" stop-opacity=".75"/>
        <stop offset=".28" stop-color="#000" stop-opacity="0"/>
        <stop offset=".72" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".8"/>
      </linearGradient>
      <linearGradient id="needleBody" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#d93d0c"/>
        <stop offset=".45" stop-color="#ff5a22"/>
        <stop offset="1" stop-color="#e8470f"/>
      </linearGradient>
      <radialGradient id="hubGrad" cx="38%" cy="32%" r="75%">
        <stop offset="0" stop-color="#2a2a2d"/>
        <stop offset=".6" stop-color="#0e0e10"/>
        <stop offset="1" stop-color="#030303"/>
      </radialGradient>
      <linearGradient id="glare" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <clipPath id="faceClip"><circle cx="150" cy="150" r="136"/></clipPath>
      <filter id="needleShadow" filterUnits="userSpaceOnUse" x="0" y="0" width="300" height="300">
        <feDropShadow dx="2" dy="3.2" stdDeviation="1.6" flood-color="#000" flood-opacity=".65"/>
      </filter>
    </defs>

    <!-- Bezel and face -->
    <circle cx="150" cy="150" r="149" fill="url(#rim)"/>
    <circle cx="150" cy="150" r="146" fill="#0a0a0b"/>
    <circle cx="150" cy="150" r="144" fill="url(#rim2)"/>
    <circle cx="150" cy="150" r="138.5" fill="#000"/>
    <circle cx="150" cy="150" r="136" fill="url(#face)"/>
    <circle cx="150" cy="150" r="136" fill="url(#faceShade)"/>

    <!-- Scale -->
    <g id="minor"></g>
    <g id="major"></g>
    <g id="labels" font-family="'Helvetica Neue', 'Arial Narrow', Arial, sans-serif" font-weight="700"></g>

    <!-- Vehicle odometer (six digits) -->
    <g id="odo"></g>

    <!-- Trip odometer (tap to reset) -->
    <g id="trip"><g id="tripDigits"></g></g>

    <!-- Unit and brand text -->
    <text id="dialUnit" x="150" y="226" text-anchor="middle" fill="#f1efe9" font-size="13" font-weight="700" letter-spacing="1.2" font-family="'Helvetica Neue', Arial, sans-serif"></text>
    <text x="150" y="242" text-anchor="middle" fill="#6a675f" font-size="7.5" letter-spacing="2.4" font-family="'Helvetica Neue', Arial, sans-serif">SPEED TIME</text>

    <!-- Hub, needle, glass -->
    <circle cx="150" cy="150" r="17" fill="url(#hubGrad)" stroke="#000" stroke-width="1"/>
    <circle cx="150" cy="150" r="14.5" fill="none" stroke="#2a2a2d" stroke-width=".6"/>
    <g filter="url(#needleShadow)">
      <g id="needle">
        <polygon points="147.5,43 152.5,43 153.4,166 146.6,166" fill="url(#needleBody)"/>
        <polygon points="148.3,43 149.4,43 149.6,166 148.4,166" fill="#ff9a70" opacity=".35"/>
      </g>
    </g>
    <g clip-path="url(#faceClip)" pointer-events="none">
      <ellipse cx="100" cy="62" rx="125" ry="62" transform="rotate(-24 100 62)" fill="url(#glare)"/>
    </g>
  </svg>
</div>

<div id="readout">
  <div id="value">--</div>
  <div id="unit">Minutes per 10 miles</div>
</div>

<div id="units"></div>
<div id="error"></div>

<script>
  const MAX_MPH = 180;
  const START_DEG = -125, SWEEP = 250;   // 0 degrees = 12 o'clock; leaves a gap at the bottom for the unit
  const CX = 150, CY = 150;
  const MPS_TO_MPH = 2.236936;
  const KM = 1.609344;
  const STOP_MPH = 1;
  const ODO_KEY = 'speedtime.odometer', TRIP_KEY = 'speedtime.trip';
  const range = (a, b, s) => { const r = []; for (let v = a; v <= b + 1e-9; v += s) r.push(v); return r; };

  // Each mode: unit name, dial ticks (positions in mph), and the value shown at each tick.
  const MODES = [
    { name: 'Minutes per 10 miles', short: 'MIN/10 MI', kind: 'time',  calc: m => 600 / m,        ticks: [30, 40, 60, 90, 120, 150, 180] },
    { name: 'Minutes per mile',     short: 'MIN/MI',    kind: 'time',  calc: m => 60 / m,         ticks: range(30, 180, 30) },
    { name: 'Minutes per km',       short: 'MIN/KM',    kind: 'time',  calc: m => 60 / (m * KM),  ticks: range(30, 180, 30) },
    { name: 'Miles per hour',       short: 'MPH',       kind: 'speed', calc: m => m,              ticks: range(0, 180, 30) },
    { name: 'Kilometers per hour',  short: 'KM/H',      kind: 'speed', calc: m => m * KM,         ticks: range(0, 300, 30).map(k => k / KM) },
  ];

  let mode = 0, mph = 0, shownMph = 0;
  let lastFix = null, recent = [];
  let odo = 11020, trip = 0;   // miles
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';

  const angleFor = v => START_DEG + SWEEP * (Math.min(v, MAX_MPH) / MAX_MPH);
  const pt = (deg, r) => {
    const rad = deg * Math.PI / 180;
    return [CX + r * Math.sin(rad), CY - r * Math.cos(rad)];
  };
  function el(tag, attrs, parent) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    parent.appendChild(n);
    return n;
  }
  function fmtTime(minutes) {
    if (!isFinite(minutes) || minutes > 99) return '--';
    const total = Math.round(minutes * 60);
    return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
  }
  function formatValue(m, mphVal) {
    const v = m.calc(mphVal);
    return m.kind === 'time' ? fmtTime(v) : Math.round(v).toString();
  }

  // Ticks and numerals follow the selected unit.
  function buildDial() {
    const m = MODES[mode];
    const major = $('major'), minor = $('minor'), labels = $('labels');
    major.innerHTML = ''; minor.innerHTML = ''; labels.innerHTML = '';

    const isMajor = v => m.ticks.some(t => Math.abs(t - v) < 0.01);
    for (let v = 0; v <= MAX_MPH; v += 5) {
      if (isMajor(v)) continue;
      const deg = angleFor(v);
      const [x1, y1] = pt(deg, 118), [x2, y2] = pt(deg, 126);
      el('line', { x1, y1, x2, y2, stroke: '#8a877f', 'stroke-width': 1.4, 'stroke-linecap': 'butt' }, minor);
    }
    m.ticks.forEach(v => {
      const deg = angleFor(v);
      const [x1, y1] = pt(deg, 108), [x2, y2] = pt(deg, 129);
      el('line', { x1, y1, x2, y2, stroke: '#f1efe9', 'stroke-width': 4, 'stroke-linecap': 'butt' }, major);
      const [tx, ty] = pt(deg, 91);
      const t = el('text', {
        x: tx, y: ty + 6, 'text-anchor': 'middle', fill: '#f5f3ec',
        'font-size': m.kind === 'time' ? 12.5 : 20, 'font-weight': 800,
        'font-family': "'Helvetica Neue', Arial, sans-serif"
      }, labels);
      t.textContent = formatValue(m, v);
    });
    $('dialUnit').textContent = m.short;
  }

  // Odometer windows: a dark drum with shading, white digit.
  const FONT = "'Helvetica Neue', Arial, sans-serif";
  function drum(g, x, y, w, h, id, invert) {
    el('rect', { x, y, width: w, height: h, rx: 2.5, fill: invert ? '#e9e5d7' : '#050505', stroke: '#2b2b2d', 'stroke-width': .8 }, g);
    el('text', { x: x + w / 2, y: y + h * 0.745, 'text-anchor': 'middle', fill: invert ? '#0a0a0a' : '#f1efe9',
      'font-size': h * 0.7, 'font-weight': 700, 'font-family': FONT, id }, g);
    el('rect', { x, y, width: w, height: h, rx: 2.5, fill: 'url(#drumShade)', 'pointer-events': 'none' }, g);
  }
  // Vehicle odometer: six digits, starts at 11,020 miles.
  function buildOdo() {
    const g = $('odo'); g.innerHTML = '';
    const w = 15, gap = 2.5, h = 24, n = 6;
    const x0 = 150 - (n * w + (n - 1) * gap) / 2;
    for (let i = 0; i < n; i++) drum(g, x0 + i * (w + gap), 108, w, h, 'odo' + i, false);
  }
  // Trip odometer: three digits and a tenths wheel (light, like the real thing).
  function buildTrip() {
    const g = $('tripDigits'); g.innerHTML = '';
    const w = 14, gap = 2, h = 20, n = 4, y = 176;
    const x0 = 150 - (n * w + (n - 1) * gap) / 2;
    el('rect', { x: x0 - 5, y: y - 5, width: n * w + (n - 1) * gap + 10, height: h + 10, fill: 'transparent' }, g);
    for (let i = 0; i < n; i++) drum(g, x0 + i * (w + gap), y, w, h, 'trip' + i, i === n - 1);
  }
  function renderOdo() {
    const digits = String(Math.floor(odo)).padStart(6, '0').slice(-6);
    for (let i = 0; i < 6; i++) $('odo' + i).textContent = digits[i];
    const t = String(Math.floor(trip * 10)).padStart(4, '0').slice(-4);
    for (let i = 0; i < 4; i++) $('trip' + i).textContent = t[i];
  }

  // Persist odometer and trip on the device only.
  function loadState() {
    try {
      const o = parseFloat(localStorage.getItem(ODO_KEY));
      const t = parseFloat(localStorage.getItem(TRIP_KEY));
      if (isFinite(o)) odo = o;
      if (isFinite(t)) trip = t;
    } catch (_) {}
  }
  function saveState() {
    try {
      localStorage.setItem(ODO_KEY, String(odo));
      localStorage.setItem(TRIP_KEY, String(trip));
    } catch (_) {}
  }
  function resetTrip() { trip = 0; saveState(); renderOdo(); }

  function renderValue() {
    const m = MODES[mode];
    const stopped = shownMph < STOP_MPH;
    $('value').textContent = stopped ? (m.kind === 'time' ? '--' : '0') : formatValue(m, shownMph);
    $('unit').textContent = m.name;
  }
  function renderChips() {
    const row = $('units');
    if (!row.children.length) {
      MODES.forEach((m, i) => {
        const b = document.createElement('button');
        b.className = 'chip';
        b.innerHTML = '<b></b><span></span>';
        b.addEventListener('click', () => { mode = i; renderAll(true); });
        row.appendChild(b);
      });
    }
    [...row.children].forEach((b, i) => {
      const m = MODES[i];
      const stopped = shownMph < STOP_MPH;
      b.classList.toggle('on', i === mode);
      b.querySelector('b').textContent = stopped ? (m.kind === 'time' ? '--' : '0') : formatValue(m, shownMph);
      b.querySelector('span').textContent = m.short;
    });
  }
  function renderNeedle() {
    $('needle').setAttribute('transform', `rotate(${angleFor(shownMph).toFixed(2)} ${CX} ${CY})`);
  }
  let dialMode = -1;
  function renderAll(forceDial) {
    if (forceDial || dialMode !== mode) { buildDial(); dialMode = mode; }
    renderValue(); renderChips(); renderNeedle();
  }

  // Smooth needle motion toward the latest reading.
  function animate() {
    shownMph += (mph - shownMph) * 0.18;
    if (Math.abs(mph - shownMph) < 0.05) shownMph = mph;
    renderNeedle(); renderValue(); renderChips();
    requestAnimationFrame(animate);
  }

  // --- GPS ---
  function haversine(a, b) {
    const R = 6371000, r = d => d * Math.PI / 180;
    const dLat = r(b.lat - a.lat), dLon = r(b.lon - a.lon);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function onFix(pos) {
    const c = pos.coords, t = pos.timestamp;
    let mps = null;
    if (c.speed != null && c.speed >= 0) mps = c.speed;
    else if (lastFix && t > lastFix.t) mps = haversine(lastFix, { lat: c.latitude, lon: c.longitude }) / ((t - lastFix.t) / 1000);

    // Distance since the last fix, counted only while moving and for short gaps.
    if (lastFix && t > lastFix.t && (t - lastFix.t) < 10000 && mps && mps > 0) {
      const miles = mps * ((t - lastFix.t) / 1000) / 1609.344;
      odo += miles; trip += miles;
    }
    lastFix = { lat: c.latitude, lon: c.longitude, t };

    if (mps == null) return;
    if (mps < 0.45) mps = 0;
    recent.push(mps); if (recent.length > 3) recent.shift();
    mph = (recent.reduce((a, b) => a + b, 0) / recent.length) * MPS_TO_MPH;
    $('status').textContent = `GPS ±${Math.round(c.accuracy * 3.28084)} ft`;
    $('status').classList.add('live');
    $('error').textContent = '';
    renderOdo();
    saveState();
  }
  function onError(err) {
    const msgs = {
      1: 'Location is blocked. Turn on Settings > Privacy & Security > Location Services > Safari.',
      2: 'No GPS signal yet.',
      3: 'GPS is slow to respond. Still trying.'
    };
    $('error').textContent = msgs[err.code] || err.message;
    $('status').textContent = 'No GPS';
    $('status').classList.remove('live');
  }
  async function start() {
    if (!('geolocation' in navigator)) { $('error').textContent = 'This browser cannot read location.'; return; }
    $('start').disabled = true; $('start').textContent = 'Live';
    $('status').textContent = 'Finding GPS...';
    try { await navigator.wakeLock?.request('screen'); } catch (_) {}
    navigator.geolocation.watchPosition(onFix, onError, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
  }

  $('start').addEventListener('click', start);
  $('readout').addEventListener('click', () => { mode = (mode + 1) % MODES.length; renderAll(true); });
  $('trip').addEventListener('click', resetTrip);

  loadState();
  buildOdo();
  buildTrip();
  renderOdo();
  renderAll(true);
  requestAnimationFrame(animate);
</script>
</body>
</html>
