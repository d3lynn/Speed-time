<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Speed Time">
<meta name="theme-color" content="#050607">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Speed%20Time%22%2C%22short_name%22%3A%22Speed%20Time%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23050607%22%2C%22theme_color%22%3A%22%23050607%22%7D">
<title>Speed Time</title>
<style>
  :root { color-scheme: dark; --bg:#050607; --panel:#0c0f13; --line:#1b2028; --fg:#f2f4f7; --dim:#6f7886; --blue:#1c69d4; --blue-hi:#5fa8ff; --red:#e10600; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 75% at 50% 38%, #12161b 0%, var(--bg) 62%);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 12px) max(16px, env(safe-area-inset-left)) calc(env(safe-area-inset-bottom) + 14px) max(16px, env(safe-area-inset-right));
    -webkit-user-select: none; user-select: none; overflow: hidden;
  }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  #status { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-variant-numeric: tabular-nums; }
  #status.live { color: var(--blue-hi); }
  #start {
    background: var(--blue); color: #fff; border: 0; border-radius: 999px;
    padding: 10px 22px; font-size: 15px; font-weight: 600; letter-spacing: .02em; cursor: pointer;
  }
  #start:disabled { background: var(--line); color: var(--dim); }
  #dial { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #gauge { width: min(92vw, 60vh, 470px); height: auto; display: block; }
  #readout { text-align: center; }
  #value { font-size: clamp(64px, 22vw, 116px); font-weight: 700; line-height: .95; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
  #unit { font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--blue-hi); margin-top: 6px; }
  #units { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 16px; }
  .chip {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 9px 4px; text-align: center; color: var(--dim); font: inherit; cursor: pointer;
  }
  .chip b { display: block; font-size: 16px; color: var(--fg); font-variant-numeric: tabular-nums; }
  .chip span { font-size: 10px; letter-spacing: .04em; }
  .chip.on { border-color: var(--blue-hi); color: var(--blue-hi); }
  #error { min-height: 18px; margin-top: 10px; font-size: 13px; color: var(--red); text-align: center; }
</style>
</head>
<body>

<header>
  <span id="status">Ready</span>
  <button id="start">Start</button>
</header>

<div id="dial">
  <svg id="gauge" viewBox="0 0 300 300" role="img" aria-label="Speedometer">
    <defs>
      <!-- Chrome bezel -->
      <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e8ebf0"/>
        <stop offset=".22" stop-color="#7b838e"/>
        <stop offset=".42" stop-color="#1b1f25"/>
        <stop offset=".6" stop-color="#9aa3ae"/>
        <stop offset=".8" stop-color="#2a2f37"/>
        <stop offset="1" stop-color="#c9ced6"/>
      </linearGradient>
      <!-- Dial face -->
      <radialGradient id="face" cx="50%" cy="38%" r="72%">
        <stop offset="0" stop-color="#1d2228"/>
        <stop offset=".65" stop-color="#0a0c0f"/>
        <stop offset="1" stop-color="#020304"/>
      </radialGradient>
      <!-- Vignette -->
      <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
        <stop offset=".7" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".6"/>
      </radialGradient>
      <!-- Needle body -->
      <linearGradient id="needle" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff6a2b"/>
        <stop offset=".35" stop-color="#f4f6f8"/>
        <stop offset="1" stop-color="#5b6370"/>
      </linearGradient>
      <!-- Hub -->
      <radialGradient id="hub" cx="40%" cy="35%" r="65%">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".4" stop-color="#8b94a1"/>
        <stop offset="1" stop-color="#14171c"/>
      </radialGradient>
      <!-- Grain texture -->
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch" result="n"/>
        <feColorMatrix type="saturate" values="0" in="n" result="g"/>
        <feComponentTransfer in="g"><feFuncA type="linear" slope=".09"/></feComponentTransfer>
        <feComposite in2="SourceGraphic" operator="in"/>
      </filter>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3.5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".7"/>
      </filter>
    </defs>

    <!-- Bezel and face -->
    <circle cx="150" cy="150" r="148" fill="url(#chrome)"/>
    <circle cx="150" cy="150" r="142" fill="#050607"/>
    <circle cx="150" cy="150" r="138" fill="url(#face)"/>
    <circle cx="150" cy="150" r="138" fill="#fff" filter="url(#grain)"/>

    <!-- Illuminated scale -->
    <g id="arcs" filter="url(#softGlow)"></g>

    <!-- Ticks and numerals -->
    <g id="minor"></g>
    <g id="major" filter="url(#softGlow)"></g>
    <g id="labels" font-family="'Helvetica Neue', 'Arial Narrow', Arial, sans-serif" font-weight="700"></g>

    <!-- Dial text -->
    <text id="dialUnit" x="150" y="196" text-anchor="middle" fill="#7fbcff" font-size="12" font-weight="600" letter-spacing="1.8" font-family="'Helvetica Neue', Arial, sans-serif"></text>
    <text x="150" y="222" text-anchor="middle" fill="#3b4350" font-size="8" letter-spacing="3.5" font-family="'Helvetica Neue', Arial, sans-serif">SPEED TIME</text>

    <!-- Vignette -->
    <circle cx="150" cy="150" r="138" fill="url(#vignette)"/>

    <!-- Needle -->
    <g id="needle" filter="url(#shadow)">
      <polygon points="150,36 153,150 147,150" fill="url(#needle)"/>
      <polygon points="150,150 152.5,176 147.5,176" fill="#5b6370"/>
    </g>
    <circle cx="150" cy="150" r="9" fill="url(#hub)" filter="url(#shadow)"/>
    <circle cx="150" cy="150" r="3" fill="#0b0d10"/>
  </svg>
</div>

<div id="readout">
  <div id="value">--</div>
  <div id="unit">Minutes per 10 miles</div>
</div>

<div id="units"></div>
<div id="error"></div>

<script>
  const MAX_MPH = 140;
  const START_DEG = -135, SWEEP = 270;   // 0 degrees = 12 o'clock
  const CX = 150, CY = 150;
  const MPS_TO_MPH = 2.236936;
  const KM = 1.609344;
  const STOP_MPH = 1;
  const range = (a, b, s) => { const r = []; for (let v = a; v <= b + 1e-9; v += s) r.push(v); return r; };

  // Each mode: unit name, dial ticks (positions in mph), and the value shown at each tick.
  const MODES = [
    { name: 'Minutes per 10 miles', short: 'min/10 mi', kind: 'time',  calc: m => 600 / m,        ticks: [20, 30, 40, 60, 80, 100, 120, 140] },
    { name: 'Minutes per mile',     short: 'min/mi',    kind: 'time',  calc: m => 60 / m,         ticks: range(20, 140, 20) },
    { name: 'Minutes per km',       short: 'min/km',    kind: 'time',  calc: m => 60 / (m * KM),  ticks: range(20, 140, 20) },
    { name: 'Miles per hour',       short: 'mph',       kind: 'speed', calc: m => m,              ticks: range(0, 140, 20) },
    { name: 'Kilometers per hour',  short: 'km/h',      kind: 'speed', calc: m => m * KM,         ticks: range(0, 220, 20).map(k => k / KM) },
  ];

  let mode = 0, mph = 0, shownMph = 0;
  let lastFix = null, recent = [];
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';

  const angleFor = v => START_DEG + SWEEP * (Math.min(v, MAX_MPH) / MAX_MPH);
  const pt = (deg, r) => {
    const rad = deg * Math.PI / 180;
    return [CX + r * Math.sin(rad), CY - r * Math.cos(rad)];
  };
  function el(tag, attrs, parent) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    parent.appendChild(n);
    return n;
  }
  function fmtTime(minutes) {
    if (!isFinite(minutes) || minutes > 99) return '--';
    const total = Math.round(minutes * 60);
    return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
  }
  function formatValue(m, mphVal) {
    const v = m.calc(mphVal);
    return m.kind === 'time' ? fmtTime(v) : Math.round(v).toString();
  }

  // Illuminated scale band: blue to 120 mph, red redline 120 to 140.
  function buildArcs() {
    const g = $('arcs');
    const band = (from, to, color, w, r, op) => {
      const [x1, y1] = pt(angleFor(from), r), [x2, y2] = pt(angleFor(to), r);
      const large = (angleFor(to) - angleFor(from)) > 180 ? 1 : 0;
      el('path', { d: `M${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2}`, fill: 'none', stroke: color, 'stroke-width': w, 'stroke-opacity': op ?? 1, 'stroke-linecap': 'butt' }, g);
    };
    band(0, MAX_MPH, '#1d232c', 4, 122);           // track
    band(0, 120, '#1c69d4', 4, 122, .55);          // blue glow
    band(0, 120, '#5fa8ff', 1.4, 122);             // bright core
    band(120, MAX_MPH, '#ff2a1a', 4.5, 122);       // redline glow
    band(120, MAX_MPH, '#ff6a55', 1.4, 122);
  }

  // Ticks and numerals follow the selected unit.
  function buildDial() {
    const m = MODES[mode];
    const major = $('major'), minor = $('minor'), labels = $('labels');
    major.innerHTML = ''; minor.innerHTML = ''; labels.innerHTML = '';

    const isMajor = v => m.ticks.some(t => Math.abs(t - v) < 0.01);
    for (let v = 0; v <= MAX_MPH; v += 5) {
      if (isMajor(v)) continue;
      const deg = angleFor(v);
      const [x1, y1] = pt(deg, 112), [x2, y2] = pt(deg, 118);
      el('line', { x1, y1, x2, y2, stroke: v >= 120 ? '#ff4a3a' : '#6d7682', 'stroke-width': 1, 'stroke-linecap': 'round' }, minor);
    }
    m.ticks.forEach(v => {
      const deg = angleFor(v);
      const [x1, y1] = pt(deg, 104), [x2, y2] = pt(deg, 118);
      const isRed = v >= 120 - 0.01;
      el('line', { x1, y1, x2, y2, stroke: isRed ? '#ff4a3a' : '#f4f6f8', 'stroke-width': 2.8, 'stroke-linecap': 'round' }, major);
      const [tx, ty] = pt(deg, 88);
      const t = el('text', {
        x: tx, y: ty + 5, 'text-anchor': 'middle',
        fill: isRed ? '#ff4a3a' : '#f4f6f8',
        'font-size': m.kind === 'time' ? 11 : 15
      }, labels);
      t.textContent = formatValue(m, v);
    });
    $('dialUnit').textContent = m.short;
  }

  function renderValue() {
    const m = MODES[mode];
    const stopped = shownMph < STOP_MPH;
    $('value').textContent = stopped ? (m.kind === 'time' ? '--' : '0') : formatValue(m, shownMph);
    $('unit').textContent = m.name;
  }
  function renderChips() {
    const row = $('units');
    if (!row.children.length) {
      MODES.forEach((m, i) => {
        const b = document.createElement('button');
        b.className = 'chip';
        b.innerHTML = '<b></b><span></span>';
        b.addEventListener('click', () => { mode = i; renderAll(true); });
        row.appendChild(b);
      });
    }
    [...row.children].forEach((b, i) => {
      const m = MODES[i];
      const stopped = shownMph < STOP_MPH;
      b.classList.toggle('on', i === mode);
      b.querySelector('b').textContent = stopped ? (m.kind === 'time' ? '--' : '0') : formatValue(m, shownMph);
      b.querySelector('span').textContent = m.short;
    });
  }
  function renderNeedle() {
    $('needle').setAttribute('transform', `rotate(${angleFor(shownMph).toFixed(2)} ${CX} ${CY})`);
  }
  let dialMode = -1;
  function renderAll(forceDial) {
    if (forceDial || dialMode !== mode) { buildDial(); dialMode = mode; }
    renderValue(); renderChips(); renderNeedle();
  }

  // Smooth needle motion toward the latest reading.
  function animate() {
    shownMph += (mph - shownMph) * 0.18;
    if (Math.abs(mph - shownMph) < 0.05) shownMph = mph;
    renderNeedle(); renderValue(); renderChips();
    requestAnimationFrame(animate);
  }

  // --- GPS ---
  function haversine(a, b) {
    const R = 6371000, r = d => d * Math.PI / 180;
    const dLat = r(b.lat - a.lat), dLon = r(b.lon - a.lon);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function onFix(pos) {
    const c = pos.coords, t = pos.timestamp;
    let mps = null;
    if (c.speed != null && c.speed >= 0) mps = c.speed;
    else if (lastFix && t > lastFix.t) mps = haversine(lastFix, { lat: c.latitude, lon: c.longitude }) / ((t - lastFix.t) / 1000);
    lastFix = { lat: c.latitude, lon: c.longitude, t };
    if (mps == null) return;
    if (mps < 0.45) mps = 0;
    recent.push(mps); if (recent.length > 3) recent.shift();
    mph = (recent.reduce((a, b) => a + b, 0) / recent.length) * MPS_TO_MPH;
    $('status').textContent = `GPS ±${Math.round(c.accuracy * 3.28084)} ft`;
    $('status').classList.add('live');
    $('error').textContent = '';
  }
  function onError(err) {
    const msgs = {
      1: 'Location is blocked. Turn on Settings > Privacy & Security > Location Services > Safari.',
      2: 'No GPS signal yet.',
      3: 'GPS is slow to respond. Still trying.'
    };
    $('error').textContent = msgs[err.code] || err.message;
    $('status').textContent = 'No GPS';
    $('status').classList.remove('live');
  }
  async function start() {
    if (!('geolocation' in navigator)) { $('error').textContent = 'This browser cannot read location.'; return; }
    $('start').disabled = true; $('start').textContent = 'Live';
    $('status').textContent = 'Finding GPS...';
    try { await navigator.wakeLock?.request('screen'); } catch (_) {}
    navigator.geolocation.watchPosition(onFix, onError, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
  }

  $('start').addEventListener('click', start);
  $('readout').addEventListener('click', () => { mode = (mode + 1) % MODES.length; renderAll(true); });

  buildArcs();
  renderAll(true);
  requestAnimationFrame(animate);
</script>
</body>
</html>
